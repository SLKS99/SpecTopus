[metadata]
name = spectopus
version = 0.1.0
description = Automated peak fitting for high-throughput perovskite research
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Sheryl Lim
author_email = your.email@example.com
url = https://github.com/SLKS99/SpecTopus

[options]
package_dir =
    =src
packages = find:
python_requires = >=3.8
include_package_data = True
install_requires =
    numpy
    pandas
    matplotlib
    google-generativeai
    lmfit
    tqdm
    plotly

[options.packages.find]
where = src

